name: CI - Linux

permissions:
  contents: write

on:
  push:
    branches: [ "linux_ci_build" ]
  pull_request:
    branches: [ "linux_ci_build" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    # runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
 
    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: apt-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}-v1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-dev \
          libiberty-dev \
          glslang-dev \
          spirv-tools \
          libfmt-dev \
          libglm-dev \
          libjpeg-dev \
          libpng-dev \
          libx11-dev \
          libxxf86vm-dev \
          libxext-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libvulkan-dev \
          libglew-dev
        sudo ar rcs /usr/lib/x86_64-linux-gnu/libglm.a

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{ github.workspace }}/build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_POLICY_VERSION_MINIMUM=3.5

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ls -R

    - name: Create Linux Release
      run: |
        DIST_DIR="${{ github.workspace }}/dist/Irrlicht-Vulkan-Linux"
        mkdir -p "$DIST_DIR/bin/Linux"

        cp -a build/bin/Linux/* "$DIST_DIR/bin/Linux/"
        cp -a build/lib/*.so* "$DIST_DIR/bin/Linux/" 2>/dev/null || true
        cp -a media "$DIST_DIR/"

        # Launcher script
        cat << 'EOF' > "$DIST_DIR/run_helloworld.sh"
        #!/usr/bin/env bash
        cd "$(dirname "$0")/bin/Linux" || exit 1
        exec ./01.HelloWorld "$@"
        EOF
        chmod +x "$DIST_DIR/run_helloworld.sh"

        tar -czf "${{ github.workspace }}/Irrlicht-Vulkan-Linux.tar.gz" -C "${{ github.workspace }}/dist" Irrlicht-Vulkan-Linux

    - name: Upload Release Asset
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ci_testing
        prerelease: true
        overwrite_files: true
        make_latest: false
        files: |
          ${{ github.workspace }}/Irrlicht-Vulkan-Linux.tar.gz
