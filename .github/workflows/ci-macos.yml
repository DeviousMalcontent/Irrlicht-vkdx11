name: CI - MacOS

on:
  push:
    branches: [ "macos_ci_build", "master" ]
  pull_request:
    branches: [ "macos_ci_build", "master" ]

env:
  BUILD_TYPE: Release
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install fmt glm jpeg libpng freetype glew molten-vk vulkan-headers vulkan-loader spirv-tools

    - name: Configure CMake
      run: |
        BREW_PREFIX="$(brew --prefix)"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${BREW_PREFIX};${BREW_PREFIX}/opt/molten-vk;${BREW_PREFIX}/opt/jpeg" \
          -DCMAKE_INCLUDE_PATH="${BREW_PREFIX}/include;${BREW_PREFIX}/opt/jpeg/include" \
          -DCMAKE_LIBRARY_PATH="${BREW_PREFIX}/lib;${BREW_PREFIX}/opt/jpeg/lib" \
          -DCMAKE_EXE_LINKER_FLAGS="-L${BREW_PREFIX}/lib -L${BREW_PREFIX}/opt/jpeg/lib -liconv" \
          -DCMAKE_SHARED_LINKER_FLAGS="-L${BREW_PREFIX}/lib -L${BREW_PREFIX}/opt/jpeg/lib -liconv" \
          -DVulkan_LIBRARY="${BREW_PREFIX}/lib/libvulkan.dylib" \
          -DVulkan_INCLUDE_DIR="${BREW_PREFIX}/include"
          
    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      working-directory: build
      run: ls -R
