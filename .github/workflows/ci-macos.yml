name: CI - MacOS

on:
  push:
    branches: [ "macos_ci_build" ]
  pull_request:
    branches: [ "macos_ci_build" ]

env:
  BUILD_TYPE: Release
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install fmt glm jpeg libpng freetype molten-vk vulkan-headers vulkan-loader glslang spirv-tools

    - name: Configure CMake
      run: |
        BREW_PREFIX="$(brew --prefix)"
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_PREFIX_PATH="${BREW_PREFIX};${BREW_PREFIX}/opt/molten-vk;${BREW_PREFIX}/opt/jpeg" \
          -DVulkan_LIBRARY="${BREW_PREFIX}/lib/libvulkan.dylib" \
          -DVulkan_INCLUDE_DIR="${BREW_PREFIX}/include"

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

    - name: Test
      working-directory: build
      run: ls -R
